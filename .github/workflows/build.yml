name: build

# 用 GitHub 的免费构建机编译 Windows 便携版和 macOS 版，不需要自己有 Mac。
# - 打 tag（v1.x.x）时自动构建并把安装包挂到对应 Release
# - 也可以在 Actions 页面手动触发，输入要发布的 tag（例如 v1.1.0）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布到的 Release tag（例如 v1.1.0）；留空则只构建不上传"
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_mingw
          cache: true

      - name: 编译
        shell: cmd
        run: |
          qmake WifiDebugHelper.pro -spec win32-g++ CONFIG+=release
          mingw32-make -j%NUMBER_OF_PROCESSORS%

      - name: 打包便携版
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item release\WifiDebugHelper.exe dist\
          windeployqt --release dist\WifiDebugHelper.exe
          Copy-Item README.md dist\
          Compress-Archive -Path dist\* -DestinationPath WifiDebugHelper-portable-win64.zip -Force
          Get-Item WifiDebugHelper-portable-win64.zip | Format-List Name,Length

      - uses: actions/upload-artifact@v4
        with:
          name: WifiDebugHelper-windows
          path: WifiDebugHelper-portable-win64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true

      - name: 编译
        run: |
          qmake WifiDebugHelper.pro -spec macx-clang CONFIG+=release
          make -j"$(sysctl -n hw.logicalcpu)"

      - name: 打包 .app / .dmg（带上 Qt 依赖）
        run: |
          macdeployqt WifiDebugHelper.app -dmg -always-overwrite
          mv WifiDebugHelper.dmg WifiDebugHelper-macos-arm64.dmg
          ls -lh WifiDebugHelper-macos-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: WifiDebugHelper-macos
          path: WifiDebugHelper-macos-arm64.dmg

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/WifiDebugHelper-portable-win64.zip
            artifacts/WifiDebugHelper-macos-arm64.dmg
          fail_on_unmatched_files: true